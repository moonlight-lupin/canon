# Canon with Docker Compose.
#
#   docker compose pull && docker compose up -d  # Canon's published image from GitHub, on http://localhost:3000
#   docker compose up -d --build                 # or built here from this folder's source
#   docker compose --profile tunnel up -d        # also start a Cloudflare Tunnel (needs TUNNEL_TOKEN in .env)
#   docker compose exec canon npm run backup     # write a backup into ./backups
#
# The public address for claude.ai is entered in Canon itself: Settings → AI / MCP → Public address.
services:
  canon:
    # the release published on GitHub (CANON_VERSION=0.18.0 for one version; latest = the newest)
    image: ghcr.io/moonlight-lupin/canon:${CANON_VERSION:-latest}
    build: .
    container_name: canon
    restart: unless-stopped
    ports:
      - "${CANON_HTTP_PORT:-3000}:3000"
    environment:
      TZ: ${TZ:-Asia/Kuala_Lumpur}
      # 1 = a test copy of the church's data: no e-mail is sent and Google Drive is left alone (docs/DOCKER.md)
      CANON_TEST_COPY: ${CANON_TEST_COPY:-}
    volumes:
      - canon-data:/app/data
      - ./backups:/app/backups

  # Optional: expose Canon to the internet for claude.ai through Cloudflare Tunnel.
  # Create a tunnel in the Cloudflare dashboard pointing to http://canon:3000 and put its token in .env.
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - canon

volumes:
  canon-data:
