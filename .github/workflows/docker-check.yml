# Every push and pull request (0.19.5): the Docker image is built and started as a church would run it, not only when
# a release is published (the 0.19.0 image failed to build and nobody knew until the release). On Linux (amd64; the
# arm64 image is built from the same Dockerfile at release):
# - the image builds; Canon starts and answers, with the version in package.json, and Docker reports it healthy;
# - a backup made inside the container (npm run backup) lands in the bind-mounted backups folder, encrypted;
# - `docker stop` in normal use and during start-up stops Canon properly (exit code 0), and it starts again;
# - the backup restores by hand into the stopped container's volume (npm run restore-backup), and Canon starts with it.
name: Docker check
on:
  push:
    branches: [main, 'test/**']
  pull_request:
permissions:
  contents: read
jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: canon:check
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start Canon, back up, stop and start, restore
        run: |
          set -euo pipefail
          want=$(node -p "require('./package.json').version")
          mkdir -p ci-backups
          sudo chown root:root ci-backups   # as a NAS makes a bind-mounted folder: Canon must take it over
          up() {
            for i in $(seq 1 90); do
              if curl -sf http://127.0.0.1:3000/api/about > about.json; then return 0; fi
              sleep 2
            done
            docker logs canon | tail -n 40
            return 1
          }
          stopped_cleanly() {
            code=$(docker inspect -f '{{.State.ExitCode}}' canon)
            echo "exit code: $code"
            test "$code" = 0
          }
          run() { docker run -d --name canon -p 3000:3000 -v canon-data:/app/data -v "$PWD/ci-backups:/app/backups" canon:check; }

          echo "::group::starts and answers"
          run
          up
          cat about.json; echo
          grep -q "\"version\":\"$want\"" about.json
          for i in $(seq 1 30); do
            h=$(docker inspect -f '{{.State.Health.Status}}' canon)
            [ "$h" = healthy ] && break
            sleep 3
          done
          echo "health: $h"
          test "$h" = healthy
          echo "::endgroup::"

          echo "::group::a backup inside the container"
          docker exec --user node canon npm run backup
          backup=$(ls ci-backups | grep -E '^canon-.*\.db\.enc$' | head -n 1)
          echo "backup: $backup"
          test -n "$backup"
          head -c 9 "ci-backups/$backup" | grep -q CANONENC   # encrypted
          echo "::endgroup::"

          echo "::group::docker stop in normal use"
          docker stop canon
          stopped_cleanly
          docker logs canon 2>&1 | grep -q 'Canon has stopped'
          echo "::endgroup::"

          echo "::group::docker stop during start-up, then a normal start"
          docker start canon
          sleep 1
          docker stop canon
          stopped_cleanly
          docker start canon
          up
          echo "::endgroup::"

          echo "::group::restoring the backup by hand"
          docker stop canon
          docker run --rm --user node -v canon-data:/app/data -v "$PWD/ci-backups:/app/backups" canon:check \
            npm run restore-backup -- "/app/backups/$backup"
          docker start canon
          up
          grep -q "\"version\":\"$want\"" about.json
          docker stop canon
          stopped_cleanly
          echo "::endgroup::"
      - name: Canon's log
        if: always()
        run: docker logs canon 2>&1 | tail -n 60 || true
