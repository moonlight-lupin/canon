# Canon's Docker image, ready to pull: built for every release (a v… tag) for ordinary PCs and servers (amd64) and
# ARM machines such as many NAS models and a Raspberry Pi (arm64), and published to GitHub's container registry as
# ghcr.io/moonlight-lupin/canon:<version> and :latest. docker-compose.yml uses it (docs/DOCKER.md).
# Run by hand (Actions → Docker image → Run workflow) with a tag, e.g. v0.18.0, to build an existing release.
name: Docker image
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'The release to build, e.g. v0.18.0'
        required: true
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - id: v
        name: The version
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          case "$TAG" in v[0-9]*) ;; *) echo "Not a release tag: $TAG"; exit 1 ;; esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.v.outputs.tag }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.v.outputs.image }}:${{ steps.v.outputs.version }}
            ${{ steps.v.outputs.image }}:latest
          labels: |
            org.opencontainers.image.title=Canon
            org.opencontainers.image.description=Local-first, multilingual church system
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max
